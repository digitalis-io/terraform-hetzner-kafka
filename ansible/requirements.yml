---
# Collections required to run site.yml / smoke-test.yml.
#
# axonops.axonops IS published on Galaxy (verified: galaxy.ansible.com API,
# highest published version 0.6.3 at time of writing) — install from there,
# not from the GitHub source directly. Galaxy's resolver supports the
# semver range below; a `type: git` source only accepts a single tag/branch/
# commit, not a range, so galaxy is both simpler and matches the pin intent.
# Range is the 0.6.x line: the role contract this playbook was written
# against (kafka role defaults, task names, inventory keys as of 0.6.3).
#
# The chrony/preflight/kafka roles call modules from ansible.posix,
# community.general and community.crypto (kafka TLS tasks). Pin all three
# explicitly: the Galaxy release of axonops.axonops does not pull them in
# reliably (CI failed on a missing community.crypto). community.docker and
# kubernetes.core are only used by roles this playbook does not run.
collections:
  # TEMPORARY (#14): axonops/axonops-ansible-collection#157 fix (KRaft
  # controller listener uses SASL PLAIN; idempotent ACLs) is not released
  # yet. Revert to the Galaxy pin of the first release that contains it
  # before merging.
  - name: https://github.com/axonops/axonops-ansible-collection.git
    type: git
    version: fix/kafka-controller-sasl-plain
  - name: ansible.posix
    version: ">=1.5.0,<3.0.0"
  - name: community.general
    version: ">=8.0.0,<14.0.0"
  - name: community.crypto
    version: ">=2.0.0,<4.0.0"
