[defaults]
# Repo root writes inventory.yml next to this ansible/ directory (ADR-0002,
# OpenTofu module output, issue #10/#12). Relative to this file's location.
inventory = ../inventory.yml
roles_path = roles
collections_path = ./.ansible/collections:~/.ansible/collections
host_key_checking = true
retry_files_enabled = false
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
# No secrets live here — Vault passwords and AxonOps keys are supplied via
# ANSIBLE_VAULT_PASSWORD_FILE / --ask-vault-pass or environment variables.

[ssh_connection]
# accept-new: trust a host's key on first connect, but still fail (not
# silently skip) if a previously-seen host key changes later.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = true

# become is set per-play (site.yml / smoke-test.yml), not forced globally
# here, since inventory.yml's ansible_user is root (ADR-0002 contract).
